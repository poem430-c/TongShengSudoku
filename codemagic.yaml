# Optional Codemagic workflow (you can also use the UI wizard).
# Closest Flutter equivalent to Expo EAS Build + Submit.

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # In Codemagic UI: create group "app_store_credentials"
        # and add App Store Connect API key fields there
        # (or use Team integrations — preferred for beginners).
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.poemc.mamasudoku"
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s)/60))
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # Prefer connecting API key via Codemagic Team integrations.
        # If using secrets group, map these variable names in the UI.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
